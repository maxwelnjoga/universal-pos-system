{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Universal POS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
               background: #f1f5f9; color: #0f172a; }
        .card { width: 100%; max-width: 380px; background: #fff; padding: 32px;
                border-radius: 14px; box-shadow: 0 10px 30px rgba(15,23,42,.1); }
        h1 { margin: 0 0 4px; font-size: 1.4rem; }
        p.sub { margin: 0 0 24px; color: #64748b; font-size: .9rem; }
        label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
                border-radius: 8px; font-size: 1rem; }
        input:focus { outline: 2px solid #2563eb; border-color: transparent; }
        button { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 8px;
                 background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .error { background: #fee2e2; color: #991b1b; padding: 10px 12px;
                 border-radius: 8px; font-size: .88rem; margin-bottom: 8px; }
    </style>
</head>
<body>
    <form class="card" method="post" action="{% url 'web-login' %}">
        {% csrf_token %}
        <h1>Universal POS</h1>
        <p class="sub">Sign in to continue</p>

        {% if form.errors %}
            <div class="error">Invalid username or password.</div>
        {% endif %}

        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus required autocomplete="username">

        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required autocomplete="current-password">

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
